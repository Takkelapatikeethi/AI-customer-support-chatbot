name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_bot
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: chat_bot/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DB_HOST: 127.0.0.1
      DB_USER: unit_test
      DB_PASSWORD: not-a-real-password
      DB_NAME: chatbot_test
      DB_SSL_CA: ../Database/certs/us-east-1-bundle.pem
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
